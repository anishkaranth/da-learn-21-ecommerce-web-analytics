<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392" font-family="Helvetica,Arial,sans-serif"><rect width="860" height="392" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Data-quality findings (rows / sessions / ids affected, all kept or fixed)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">4,295,584 clean events, 360,129 sessions, 4,887 transactions</text><rect x="238" y="55.6" width="460.0" height="16.9" fill="#f2cc8f"/><text x="232" y="68" font-size="10" text-anchor="end" fill="#333">sessions with 2+ session mediums</text><text x="702" y="68" font-size="9" text-anchor="start" fill="#444">53,993</text><rect x="238" y="79.8" width="350.7" height="16.9" fill="#f2cc8f"/><text x="232" y="92" font-size="10" text-anchor="end" fill="#333">users with 2+ first-touch mediums</text><text x="593" y="92" font-size="9" text-anchor="start" fill="#444">41,164</text><rect x="238" y="103.9" width="84.4" height="16.9" fill="#f2cc8f"/><text x="232" y="116" font-size="10" text-anchor="end" fill="#333">ga_session_id shared by 2+ users</text><text x="326" y="116" font-size="9" text-anchor="start" fill="#444">9,906</text><rect x="238" y="128.1" width="44.9" height="16.9" fill="#f2cc8f"/><text x="232" y="141" font-size="10" text-anchor="end" fill="#333">sessions w/o session_start</text><text x="287" y="141" font-size="9" text-anchor="start" fill="#444">5,272</text><rect x="238" y="152.2" width="16.0" height="16.9" fill="#f2cc8f"/><text x="232" y="165" font-size="10" text-anchor="end" fill="#333">purchase sessions w/o add_to_cart</text><text x="258" y="165" font-size="9" text-anchor="start" fill="#444">1,873</text><rect x="238" y="176.4" width="3.8" height="16.9" fill="#f2cc8f"/><text x="232" y="189" font-size="10" text-anchor="end" fill="#333">zero-revenue purchase events</text><text x="246" y="189" font-size="9" text-anchor="start" fill="#444">450</text><rect x="238" y="200.5" width="3.6" height="16.9" fill="#f2cc8f"/><text x="232" y="213" font-size="10" text-anchor="end" fill="#333">transactions w/o transaction id</text><text x="246" y="213" font-size="9" text-anchor="start" fill="#444">421</text><rect x="238" y="224.7" width="3.0" height="16.9" fill="#f2cc8f"/><text x="232" y="237" font-size="10" text-anchor="end" fill="#333">repeat purchase events collapsed</text><text x="245" y="237" font-size="9" text-anchor="start" fill="#444">355</text><rect x="238" y="248.9" width="1.1" height="16.9" fill="#f2cc8f"/><text x="232" y="261" font-size="10" text-anchor="end" fill="#333">revenue outliers (&gt; Q3 + 3 IQR)</text><text x="243" y="261" font-size="9" text-anchor="start" fill="#444">127</text><rect x="238" y="273.0" width="0.3" height="16.9" fill="#f2cc8f"/><text x="232" y="285" font-size="10" text-anchor="end" fill="#333">repeated header lines dropped</text><text x="242" y="285" font-size="9" text-anchor="start" fill="#444">31</text><rect x="238" y="297.2" width="0.2" height="16.9" fill="#f2cc8f"/><text x="232" y="310" font-size="10" text-anchor="end" fill="#333">sessions spanning &gt; 4 h</text><text x="242" y="310" font-size="9" text-anchor="start" fill="#444">26</text><rect x="238" y="321.3" width="0.1" height="16.9" fill="#f2cc8f"/><text x="232" y="334" font-size="10" text-anchor="end" fill="#333">transaction ids reused across sessions</text><text x="242" y="334" font-size="9" text-anchor="start" fill="#444">15</text><rect x="238" y="345.5" width="0.1" height="16.9" fill="#f2cc8f"/><text x="232" y="358" font-size="10" text-anchor="end" fill="#333">events with engagement &gt; 1 h</text><text x="242" y="358" font-size="9" text-anchor="start" fill="#444">10</text><line x1="238" y1="52" x2="238" y2="366" stroke="#999"/></svg>
